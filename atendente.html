<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palace burg — Atendente</title><link rel="stylesheet" href="style.css"><link rel="icon" href="/logo-palace-burg.webp" type="image/webp"></head><body data-role="atendente"><header class="brand-header"><div class="brand-inner"><a class="brand-mark" href="/delivery.html" aria-label="Palace Burg — ir ao delivery"><img src="/logo-palace-burg.webp" alt="Logo Palace Burg" width="136" height="144"></a><div class="brand-heading"><span class="eyebrow">PALACE BURG • BELÉM</span><h1>Painel do Atendente</h1><p>Pedidos e atendimento de balcão.</p></div></div></header><main><nav class="tabs"><a href="/delivery.html" target="_blank" rel="noopener">🛵 Site de delivery (aba separada)</a></nav><section id="auth" class="panel" hidden><h2>Login</h2><form onsubmit="login(event)"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button></form></section><section id="app" class="panel" hidden><button onclick="logout()">Sair</button><h2>Novo pedido no balcão</h2><p>Escolha os lanches cadastrados e adicione ao pedido.</p><input id="counter-search" type="search" oninput="showCounterProducts()" placeholder="🔎 Buscar lanche ou bebida"><div id="counter-categories" class="category-filter"></div><div id="counter-products" class="product-grid"></div><section class="panel"><h3>Carrinho do atendente</h3><div id="counter-cart">Nenhum item adicionado.</div><p id="counter-total"></p><form onsubmit="counterCheckout(event)"><input id="counter-name" placeholder="Nome do cliente" required minlength="2"><select id="counter-type" onchange="counterToggle()"><option value="retirada">Retirada no balcão (sem frete)</option><option value="entrega">Entrega (frete automático)</option></select><div id="counter-delivery" hidden><input id="counter-phone" placeholder="Telefone do cliente"><input id="counter-address" placeholder="Endereço completo, número e bairro"><button type="button" onclick="counterQuote()">Calcular frete</button><p id="counter-quote"></p></div><select id="counter-payment"><option>Pix</option><option>Dinheiro</option><option>Crédito</option><option>Débito</option></select><button type="submit">Registrar pedido</button></form><p id="counter-result" role="status"></p></section><h2>Fila de pedidos</h2><div id="orders"></div></section></main><script src="app.js"></script></body></html>
