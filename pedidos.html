<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palace burg — Delivery</title><link rel="stylesheet" href="style.css"><link rel="icon" href="/logo-palace-burg.webp" type="image/webp"></head><body data-role="cliente"><header class="brand-header"><div class="brand-inner"><a class="brand-mark" href="/delivery.html" aria-label="Palace Burg — ir ao delivery"><img src="/logo-palace-burg.webp" alt="Logo Palace Burg" width="136" height="144"></a><div class="brand-heading"><span class="eyebrow">PALACE BURG • BELÉM</span><h1>Pedidos Online</h1><p>Escolha seus lanches favoritos.</p></div></div></header><main><section id="auth" class="panel" hidden><h2>Login</h2><form onsubmit="login(event)"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button></form></section><section id="app" class="panel" ><nav class="tabs"><button type="button" onclick="tabCliente('menu')">🍔 Cardápio</button><button type="button" onclick="tabCliente('checkout')">🛒 Meu carrinho</button></nav><div id="client-menu"><h2>Cardápio e pedidos</h2><p id="store-info" class="store-info">Pedido mínimo R$ 20,00 • Horário 18:00 - 02:00</p><input id="menu-search" type="search" oninput="showMenu()" placeholder="🔎 Buscar lanche ou bebida" aria-label="Buscar no cardápio"><div id="menu-categories" class="category-filter"></div><div id="list" class="product-grid"></div></div><div id="client-checkout" hidden><h2>Meu carrinho</h2><div id="cart"></div><form onsubmit="buy(event)"><input id="customer" placeholder="Nome" required><input id="phone" placeholder="Telefone" required><textarea id="address" placeholder="Endereço completo" required></textarea><select id="payment"><option>Pix</option><option>Dinheiro</option><option>Crédito</option><option>Débito</option></select><button type="button" onclick="quote()">Calcular frete</button><button>Confirmar pedido</button></form><p id="quote" aria-live="polite"></p></div></section></main><script src="app.js"></script></body></html>
